apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-demo

  template:
    metadata:
      labels:
        app: flask-demo

    spec:
      containers:
        - name: flask-container
          image: docker-kubernetes-activity:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000